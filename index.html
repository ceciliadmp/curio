  else if(h.startsWith('c-') && catOf(h.slice(2))){ const c=catOf(h.slice(2)); S=secOfCat(c.id); html=viewCategory(c); title=c.name+' · Curió'; }
  else if(h.startsWith('v-') && itemById(h.slice(2))){ const b=itemById(h.slice(2)); S=secOfCat(b.cat); html=viewItem(b); after=()=>mountDemo(b,S); title=b.name+' · Curió'; }
  else if(h==='sobre'||h==='quem-somos'){ html=viewAbout(); title='Sobre · Curió'; nav='sobre'; }
  else if(h==='artigos'){ html=viewArticles(); title='Artigos · Curió'; nav='artigos'; }
  else if(h.startsWith('artigo-') && articleById(h.slice(7))){ const a=articleById(h.slice(7)); html=viewArticle(a); title=(a.articleTitle||a.title)+' · Curió'; nav='artigos'; }
  else if(h.startsWith('artigo-') && !window.__curioDbLoaded){ html='<section class="view page bg-50"><p class="art-empty">Carregando artigo…</p></section>'; nav='artigos'; }
  else if(h==='trilhas'){ html=viewTrails(); title='Trilhas · Curió'; nav='trilhas'; }
  else if(h==='design-comportamental'){ html=viewTrail(); title='Design Comportamental · Curió'; nav='trilhas'; }
  else if(h==='contato'){ html=viewContact(); title='Contato · Curió'; nav='contato'; }
  else { html=viewLanding(); after=bindFeedback; }
  if(S) nav='trilhas';
  curS=S;
  document.querySelectorAll('[data-nav]').forEach(a=>a.dataset.nav===nav?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  app.innerHTML=html; after&&after();
  document.title=title;
  window.scrollTo({top:0,behavior:'instant'});
}
/* Feedback form: each person writes only under feedback/<their id>; the owner and Editors read them all. */
async function bindFeedback(){
  const form=document.getElementById('fb-form'); if(!form) return;
  const ta=form.querySelector('textarea'), btn=form.querySelector('button'), st=document.getElementById('fb-status');
  const say=(t,kind)=>{st.textContent=t;st.dataset.kind=kind||'';};
  let db=null,user=null,uid=null;
  const ready=(async()=>{
    try{ [db,user]=await Promise.all([claude.use('db'),claude.use('user')]); }catch(e){}
    if(user){ try{ uid=await user.id(); }catch(e){} }
    return !!(db&&uid);
  })();
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const text=ta.value.trim();
    if(!text){ say('Escreva seu feedback antes de enviar.','err'); ta.focus(); return; }
    btn.disabled=true; say('Enviando…');
    const ok=await ready;
    if(!ok){ btn.disabled=false; say(typeof window.claude==='undefined'?'O envio de feedback ainda não está disponível por aqui. Fale com a gente pelas redes ao lado.':'Não deu pra enviar daqui. Entre na sua conta do claude.ai e tente de novo.','err'); return; }
    const send=()=>db.collection('feedback/'+uid+'/mensagens').add({texto:text,enviadoEm:new Date().toISOString(),pagina:'home'});
    try{
      try{ await send(); }catch(err){ if(err&&err.code==='unavailable'){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); await send(); } else throw err; }
      ta.value=''; say('Valeu! Seu feedback chegou direitinho.','ok');
    }catch(err){
      const c=err&&err.code;
      say(c==='invalid_argument'?'Sua conta não tem permissão pra enviar feedback aqui.':c==='resource_exhausted'?'Calma, muitos envios seguidos. Tente de novo daqui a pouco.':'Não deu pra enviar agora. Tente de novo em instantes.','err');
    }finally{ btn.disabled=false; }
  });
}

(function(){
  const btn=document.getElementById('burger'), panel=document.getElementById('mnav'), mast=document.querySelector('.mast');
  const set=open=>{panel.hidden=!open;btn.setAttribute('aria-expanded',open);btn.setAttribute('aria-label',open?'Fechar menu':'Abrir menu');mast.classList.toggle('menu-open',open);};
  btn.addEventListener('click',()=>set(panel.hidden));
  panel.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>set(false)));
  window.addEventListener('hashchange',()=>set(false));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden){set(false);btn.focus();}});
  window.matchMedia('(min-width:761px)').addEventListener('change',e=>{if(e.matches)set(false);});
})();


/* Hero eyes: the white stays put, the pupils follow the pointer */
(function(){
  let raf=0, mx=0, my=0;
  const MAX=22; /* svg units the pupil may travel inside the white */
  function update(){
    raf=0;
    document.querySelectorAll('.hero-eyes svg').forEach(svg=>{
      const r=svg.getBoundingClientRect(); if(!r.width) return;
      const k=r.width/200; /* px per svg unit */
      svg.querySelectorAll('.eye-pupil').forEach(p=>{
        const cx=r.left+(+p.dataset.cx)*k, cy=r.top+50*k;
        const dx=mx-cx, dy=my-cy, d=Math.hypot(dx,dy)||1;
        const t=Math.min(d/k,MAX*6)/(MAX*6)*MAX; /* ease toward the edge as the pointer moves away */
        p.setAttribute('transform','translate('+(dx/d*t).toFixed(2)+' '+(dy/d*t).toFixed(2)+')');
      });
    });
  }
  document.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(!raf)raf=requestAnimationFrame(update);},{passive:true});
})();

window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{
  const q=document.getElementById('q');
  if(e.key==='/' && q && document.activeElement!==q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();q.focus();}
  if(e.key==='Escape' && q && document.activeElement===q){q.value='';query='';renderResults();}
});
route();
loadDbArticles();
