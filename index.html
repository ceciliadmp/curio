<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Curió: plataforma brasileira de aprendizado de design. Design que se aprende na troca.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Curió · Design que se aprende na troca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Open+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: light-grey canvas, rounded flat cards, sans titles with one serif-italic word.
   Brand palette: Yellow 100 #FFE14F / 300 #FFB700 / 400 #FF9900 (shadow only),
   Pink 100 #FFCAE7 / 300 #FF76B8 / 400 #FF52A5 (shadow only),
   Purple 100 #AD85D1 / 300 #8144A8 / 400 #5F2B89 (shadow only).
   Text-safe variations (darker) are used where a brand color carries small text. */
:root{
  /* Warm Grey 100 #F9F4F2 · 200 #E2DED9 · 300 #C6C1B9 · 400 #A8A5A0 · 500 #63605D · 600 #44423F · 700 #2D2C2B · 800 #141313 */
  --bg:#F9F4F2; --surface:#FFFFFF; --ink:#141313; --ink-2:#44423F; --ink-3:#63605D;
  --line:#E2DED9; --rule:#C6C1B9;
  --accent:#2D2C2B; --accent-t:#E2DED9; --pop:#C6C1B9; --dot:#E2DED9;
  --t-pink:#FFCAE7; --t-yellow:#FFE14F;
  --t-green:#FFF3B0; --t-purple:#FFE14F; --t-orange:#FFCAE7; --deco:rgba(255,255,255,.45);
  --c-info:#8144A8; --c-info-t:#F0E7F7;
  --c-mean:#C42A78; --c-mean-t:#FFE6F3;
  --c-fast:#A35F00; --c-fast-t:#FFF4CC;
  --c-mem:#5F2B89;  --c-mem-t:#ECE3F4;
  --on-cat:#FFFFFF;
  --good:#15803D; --good-t:#E7F5EC; --bad:#B42318; --bad-t:#FCEBE9; --warn:#A15C07;
  --f-display:"Figtree","Helvetica Neue",Arial,sans-serif;
  --f-hand:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem; --s7:3rem; --s8:4.5rem;
  --radius:16px; --radius-lg:22px; --ease:cubic-bezier(.2,.7,.2,1);
  --r-hand:22px;
  --r-hand-sm:14px;
  --r-hand-pill:999px;
  --shadow:none;
  --shadow-hover:none;
}
:root[data-theme="dark"]{
  --bg:#141313; --surface:#2D2C2B; --ink:#F9F4F2; --ink-2:#C6C1B9; --ink-3:#A8A5A0;
  --line:#44423F; --rule:#63605D;
  --accent:#F9F4F2; --accent-t:#44423F; --pop:#44423F; --dot:#2D2C2B;
  --t-pink:#3B1F33; --t-yellow:#3A3112;
  --t-green:#3A3112; --t-purple:#3A3112; --t-orange:#3B1F33; --deco:rgba(255,255,255,.05);
  --c-info:#C9A6EA; --c-info-t:#2D1F3D; --c-mean:#FF9CCB; --c-mean-t:#3B1F33;
  --c-fast:#FFC84D; --c-fast-t:#3A3112; --c-mem:#B994DC; --c-mem-t:#271C35;
  --on-cat:#141018;
  --good:#5BD68A; --good-t:#13291D; --bad:#FF8A80; --bad-t:#3A1A18; --warn:#F2B455;
  color-scheme:dark}

[data-cat="informacao"]{--cat:var(--c-info);--cat-t:var(--c-info-t)}
[data-cat="significado"]{--cat:var(--c-mean);--cat-t:var(--c-mean-t)}
[data-cat="rapido"]{--cat:var(--c-fast);--cat-t:var(--c-fast-t)}
[data-cat="memoria"]{--cat:var(--c-mem);--cat-t:var(--c-mem-t)}

*,*::before,*::after{box-sizing:border-box}
html{font-size:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;
  padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
@media (max-width:479px){body{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-block:var(--s6) var(--s8)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono)}
.eyebrow{font:500 .72rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Masthead ---------- */
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:var(--s3);margin-bottom:var(--s6)}
.mast a{text-decoration:none;font:600 .8rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.mast .meta{font:400 .75rem var(--f-mono);color:var(--ink-2)}
.mast-right{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.theme-sw{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem .5rem;border:0;background:none;color:var(--ink-3);cursor:pointer;border-radius:999px}
.theme-sw svg{width:16px;height:16px;transition:color .25s}
.theme-sw .track{position:relative;width:44px;height:24px;border-radius:999px;background:var(--line);border:1px solid var(--rule);transition:background .25s var(--ease)}
.theme-sw .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(15,18,24,.3);transition:transform .25s var(--ease)}
.theme-sw[aria-checked="true"] .track{background:var(--c-info)}
.theme-sw[aria-checked="true"] .knob{transform:translateX(20px);background:var(--ink)}
.theme-sw[aria-checked="false"] .sun,.theme-sw[aria-checked="true"] .moon{color:var(--ink)}

/* ---------- Hero ---------- */
.hero{display:grid;gap:var(--s5);margin-bottom:56px;padding-top:calc(56px - var(--s6));text-align:center;justify-items:center}
.hero .search{margin-inline:auto}
.mast{justify-content:center!important;text-align:center}
.mast-right{justify-content:center}
.hero h1{font-size:clamp(2rem,4.6vw,3.4rem);font-weight:800;font-stretch:88%;line-height:.95;letter-spacing:-.03em;width:100%}
.hero h1.fit{white-space:nowrap;text-wrap:nowrap}
@media (max-width:479px){.hero .intro{padding-inline:0!important}}
@media (min-width:480px) and (max-width:767px){.hero .intro{padding-inline:24px!important}}
.hero .intro{padding-inline:80px;font-size:1.125rem;line-height:1.45;color:var(--ink-2);max-width:none;text-wrap:pretty}
.search{position:relative;max-width:34rem}
.search input{width:100%;font:500 1rem var(--f-body);color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.9rem 3rem .9rem 2.9rem;box-shadow:var(--shadow);transition:box-shadow .2s var(--ease),border-color .2s}
.search input:focus{outline:none;border-color:var(--rule);box-shadow:0 0 0 4px var(--line),var(--shadow)}
.search svg{position:absolute;left:1.05rem;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-2)}
.search kbd{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);font:500 .72rem var(--f-mono);
  border:1px solid var(--line);border-radius:6px;padding:.1rem .45rem;color:var(--ink-2);background:var(--bg)}
.search-hint{margin-top:var(--s2);font:400 .78rem var(--f-mono);color:var(--ink-2)}

/* ---------- Results ---------- */
.results{margin-bottom:var(--s6);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:0 var(--s4) var(--s2);box-shadow:var(--shadow)}
.results .head{display:flex;justify-content:space-between;padding:var(--s3) 0;font:500 .8rem var(--f-mono);color:var(--ink-2)}
.res{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:var(--s4);align-items:center;padding:var(--s4) 0;
  border-top:1px solid var(--line);text-decoration:none;border-radius:12px;transition:padding .2s var(--ease),background .2s}
.res:hover{padding-left:var(--s3);background:var(--cat-t)}
.res i{width:12px;height:12px;background:var(--cat);border-radius:50%}
.res b{font-family:var(--f-display);font-size:1.15rem;font-weight:700}
.res span{display:block;color:var(--ink-2);font-size:.9rem}
.res small{font:500 .72rem var(--f-mono);color:var(--cat);text-transform:uppercase;letter-spacing:.06em;text-align:right}
.empty{padding:var(--s5) 0;color:var(--ink-2)}

/* ---------- Hub (4 quadrants) ---------- */
.hub{display:grid;gap:var(--s4)}
@media (min-width:1100px){.hub{gap:var(--s5)}}
@media (min-width:760px){.hub{grid-template-columns:1fr 1fr}}
.qcard{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:var(--s5);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  padding:var(--s5);min-height:14rem;text-decoration:none;overflow:hidden;isolation:isolate;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.qcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
@media (min-width:1100px){.qcard{padding:var(--s6);min-height:16rem}}
.qcard::before{content:"";position:absolute;inset:0;background:var(--c-mean-t);transform:scaleY(0);transform-origin:bottom;
  transition:transform .45s var(--ease);z-index:-1}
.qcard:hover::before,.qcard:focus-visible::before{transform:scaleY(1)}
.qcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4)}
.qcard .count{font:500 .85rem var(--f-body);color:var(--ink-2);font-variant-numeric:tabular-nums}
.qcard .count b{color:var(--ink);font-weight:700}
.qcard .go-r{display:inline-flex;align-items:center;gap:.4rem}
.qtile{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--c-mean-t);flex:none}
.qcard .count small{display:block;font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-top:.35rem}
.qicon{width:28px;height:28px;flex:none;color:var(--c-mean);transition:transform .5s var(--ease)}
.qcard:hover .qicon{transform:rotate(-8deg) scale(1.06)}
.qcard h2{font-size:clamp(1.6rem,3.2vw,2.4rem);font-weight:800;font-stretch:90%;line-height:1}
.qcard .en{font:500 .78rem var(--f-mono);color:var(--c-mean);margin-top:var(--s2);letter-spacing:.04em}
.qcard p.desc{color:var(--ink-2);margin-top:var(--s3);max-width:42ch}
.qcard .go{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:var(--s3);
  font:600 .85rem var(--f-body)}
.qcard .go svg{width:22px;height:22px;transition:transform .3s var(--ease)}
.qcard:hover .go svg{transform:translateX(6px)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s5);margin-top:var(--s5);font:400 .78rem var(--f-mono);color:var(--ink-2)}
.legend b{color:var(--ink);font-weight:600}

/* ---------- Sticky pillar bar ---------- */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:var(--s3);align-items:center;
  border-bottom:1px solid var(--line);padding-block:var(--s3);margin-bottom:var(--s6)}
.back{display:inline-flex;align-items:center;gap:.4rem;flex:none;font:600 .85rem var(--f-body);text-decoration:none;
  padding:.5rem .95rem .5rem .75rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.back:hover{border-color:var(--rule);box-shadow:var(--shadow-hover)}
.back svg{width:16px;height:16px}
.pillars{display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none;min-width:0}
.pillars::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;align-items:center;gap:.45rem;padding:.5rem .75rem;text-decoration:none;font:500 .82rem var(--f-body);
  color:var(--ink-2);border-radius:999px;transition:color .2s,background .2s}
.pill i{width:9px;height:9px;background:var(--cat);border-radius:50%}
.pill:hover{color:var(--ink);background:var(--cat-t)}
.pill[aria-current="true"]{color:var(--ink);background:var(--cat-t);font-weight:700}
@media (max-width:620px){.pill .lbl-long{display:none}.back .lbl{display:none}}
@media (min-width:621px){.pill .lbl-short{display:none}}

/* ---------- Category view ---------- */
.chead{display:grid;gap:var(--s5);padding-bottom:var(--s6);margin-bottom:var(--s6);border-bottom:1px solid var(--line)}
@media (min-width:900px){.chead{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);align-items:end;gap:var(--s6)}}
.chead .qtile{width:72px;height:72px;border-radius:20px}
.chead .qicon{width:38px;height:38px}
.chead h1{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:800;font-stretch:85%;line-height:.95}
.chead .en{font:500 .85rem var(--f-mono);color:var(--cat);margin-top:var(--s2)}
.chead .long{color:var(--ink-2);max-width:52ch}
.chead .long b{display:block;color:var(--ink);margin-top:var(--s3);font-weight:600}
.blist{display:grid;gap:var(--s4)}
@media (min-width:640px){.blist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.blist{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bcard{display:flex;flex-direction:column;gap:var(--s3);background:var(--surface);padding:var(--s5);text-decoration:none;
  border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  transition:background .25s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease)}
.bcard:hover{background:var(--cat-t);transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.bcard .tag{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--cat)}
.bcard h3{font-size:1.5rem;font-weight:750;font-stretch:92%;line-height:1.05}
.bcard .en{font:400 .75rem var(--f-mono);color:var(--ink-2)}
.bcard p{color:var(--ink-2);font-size:.95rem}
.bcard .more{margin-top:auto;padding-top:var(--s3);display:flex;align-items:center;gap:.4rem;font:600 .82rem var(--f-body)}
.bcard .more svg{width:16px;height:16px;transition:transform .25s var(--ease)}
.bcard:hover .more svg{transform:translateX(4px)}
/* fill last row: if 5 items in 3-col grid, last spans 2 */
@media (min-width:1100px){.blist.n5 .bcard:last-child{grid-column:span 2}}
@media (min-width:640px) and (max-width:1099px){.blist.n5 .bcard:last-child{grid-column:span 2}}

/* ---------- Detail ---------- */
.crumbs{font:400 .78rem var(--f-mono);color:var(--ink-2);display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:var(--s4)}
.crumbs a{text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs a:hover{border-color:var(--ink)}
.dhead{display:grid;gap:var(--s3);margin-bottom:var(--s6);padding-bottom:var(--s5);border-bottom:1px solid var(--line)}
.dhead h1{font-size:clamp(2.2rem,6vw,4.4rem);font-weight:800;font-stretch:85%;line-height:.95;letter-spacing:-.025em}
.dhead .en{font:500 .85rem var(--f-mono);color:var(--cat)}
.dgrid{display:grid;gap:var(--s6);grid-template-areas:"text" "demo"}
@media (min-width:1000px){
  .dgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-areas:"text demo";column-gap:var(--s7);align-items:start}
  .dcol-demo{position:sticky;top:calc(env(safe-area-inset-top,0px) + 5.25rem)}
}
.dcol-text{grid-area:text;display:grid;gap:var(--s6)}
.dcol-demo{grid-area:demo;min-width:0}
.dcol-eth{grid-area:eth;min-width:0}
.sec{display:grid;gap:var(--s3)}
.sec h2{font-size:.78rem;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  display:flex;gap:.6rem;align-items:center}
.sec h2 i{font-style:normal;color:var(--cat);font-weight:600}
.sec h2::after{content:"";flex:1;height:1px;background:var(--line)}
.lead{font-size:clamp(1.2rem,2vw,1.45rem);line-height:1.4;font-weight:500;max-width:36ch;font-family:var(--f-body)}
.body{color:var(--ink-2);max-width:62ch}
.dnav{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s7)}
.dnav a{background:var(--surface);padding:var(--s4) var(--s5);text-decoration:none;display:grid;gap:.2rem;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:background .2s}
.dnav a:hover{background:var(--cat-t)}
.dnav a.next{text-align:right}
.dnav small{font:500 .7rem var(--f-mono);color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.dnav b{font-family:var(--f-display);font-size:1.05rem}

/* ---------- Demo stage ---------- */
.stage{background:var(--cat-t);padding:var(--s4);display:grid;gap:var(--s4);border-radius:var(--radius-lg)}
@media (min-width:600px){.stage{padding:var(--s5)}}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;width:max-content;max-width:100%;box-shadow:var(--shadow)}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:10px;padding:.5rem .8rem;font:500 .8rem var(--f-body);cursor:pointer;
  display:flex;align-items:center;gap:.45rem;transition:background .2s,color .2s}
.seg button:hover{background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .k{width:8px;height:8px;border-radius:50%;flex:none}
.k.good{background:var(--good)} .k.bad{background:var(--bad)} .k.neutral{background:var(--ink-3)}
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3);align-items:start;background:var(--surface);
  border-radius:14px;padding:var(--s3) var(--s4);font-size:.92rem;color:var(--ink-2)}
.note.good{border-left-color:var(--good)} .note.bad{border-left-color:var(--bad)}
.chip{font:600 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:.25rem .6rem;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--good-t);color:var(--good)} .chip.bad{background:var(--bad-t);color:var(--bad)} .chip.neutral{background:var(--bg);color:var(--ink-2)}
.mock-host{animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Mock primitives ---------- */
.mock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:.9rem;
  box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(15,18,24,.35)}
.mock-bar{display:flex;align-items:center;gap:6px;padding:.5rem .75rem;border-bottom:1px solid var(--line);background:var(--bg)}
.mock-bar span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mock-bar code{margin-left:.5rem;font:400 .7rem var(--f-mono);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mock-body{padding:var(--s4);display:grid;gap:var(--s3)}
@media (min-width:600px){.mock-body{padding:var(--s5)}}
.m-h{font:700 1.05rem/1.25 var(--f-display)}
.m-sub{color:var(--ink-2);font-size:.85rem}
.m-row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.m-row.end{justify-content:flex-end}
.m-btn{font:600 .85rem/1 var(--f-body);padding:.7rem 1rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  color:var(--ink);cursor:pointer;transition:transform .12s,filter .2s,background .2s}
.m-btn:hover{background:var(--bg)}
.m-btn:active{transform:scale(.97)}
.m-btn.pri{background:var(--cat);border-color:var(--cat);color:var(--on-cat)}
.m-btn.pri:hover{filter:brightness(1.08)}
.m-btn.ghost{border-color:transparent;background:transparent}
.m-btn.full{width:100%}
.m-btn.big{padding:.95rem 1rem;font-size:.95rem}

.field{display:grid;gap:.3rem}

.chart{width:100%;height:auto;display:block}

/* ================= Curió type scale (brand book 07, v2) =================
   Display 72/72 Gabarito 800 · H1 48/52 Gabarito 800 · H2 36/40 Gabarito 700
   H3 32/40 DM Sans 700 · Subtítulo 24/32 DM Sans 500 · Corpo 20/32 DM Sans 400
   Corpo P 16/24 DM Sans 400 · Legenda 12/16 DM Sans 500
   Up to 32px → DM Sans; above → Gabarito. Sizes and line-heights in multiples of 4. */
:root{--ff-g:"Gabarito","Helvetica Neue",Arial,sans-serif;--ff-d:"DM Sans","Helvetica Neue",Arial,sans-serif}
body{font:400 16px/24px var(--ff-d)}
/* Display */

/* H1 */
.hero h1,.chead h1,.dhead h1{font:800 48px/52px var(--ff-g)!important;letter-spacing:-.015em!important}
.ab-big{font:800 48px/52px var(--ff-g)!important;letter-spacing:-.015em}

.lhero .lsec,.lsec{font:700 36px/40px var(--ff-g)!important;letter-spacing:-.01em}

.qcard h2,.qtext h2,.bcard h3{font:700 24px/32px var(--ff-d)!important;letter-spacing:0!important}
.t-h,.ab-mid{font:700 20px/28px var(--ff-d)!important}

/* Subtítulo */
.lsub,.hero .intro,.about-head .lsub,.lead{font:500 24px/32px var(--ff-d)!important}
/* Corpo */
.body,.ab-text,.chead .long{font:400 20px/32px var(--ff-d)!important}

/* Corpo P: cards, buttons, interface */
.qcard p.desc,.qtext p.desc,.bcard p,.t-p,.ab-list,.note,.res span,.search input,.m-out,.xchip,.pill,.back,
.mast .navlinks a,.qcard .go,.qcard .count,.qcard .go-r,.bcard .more,.t-go,.seg button{font-family:var(--ff-d)!important;font-size:16px!important;line-height:24px!important}

.qcard p.desc,.qtext p.desc,.bcard p,.t-p,.res span{font-weight:400!important}
.ab-label,.sec h2,.chead .en,.dhead .en,.bcard .en,.ab-chips span{font:700 16px/24px var(--ff-d)!important;letter-spacing:0!important;text-transform:none!important}

.crumbs,.foot,.bcard .tag,.chip,.eyebrow,.m-fine,.mock-bar code{font-family:var(--ff-d)!important;font-weight:500!important;font-size:12px!important;line-height:16px!important;letter-spacing:.02em!important}

/* small headings inside mockups are ≤32px → DM Sans */
.m-h,.price,.big-claim,.plan .pn{font-family:var(--ff-d)!important}
.m-h{font-weight:700!important;font-size:20px!important;line-height:28px!important}
.price{font-weight:700!important;font-size:24px!important;line-height:32px!important;letter-spacing:0!important}
.big-claim{font-weight:700!important;font-size:24px!important;line-height:32px!important}
@media (max-width:599px){
  .lhero h1,.about-head h1{font-size:48px!important;line-height:52px!important}
  .hero h1,.chead h1,.dhead h1,.ab-big{font-size:36px!important;line-height:40px!important}
  .lsub,.hero .intro,.about-head .lsub,.lead{font-size:20px!important;line-height:28px!important}
  .body,.ab-text,.chead .long{font-size:16px!important;line-height:24px!important}
  .lsec,.lhero .lsec{font-size:32px!important;line-height:40px!important;font-family:var(--ff-d)!important}
}

/* lime "estalo" beside the title, on the indigo hero (lime is allowed on anil) */
.lhero-text{position:relative;overflow:hidden}
.lhero-text>div:not(.hero-shape){position:relative;z-index:1;max-width:min(100%,760px)}
.hero-shape{position:absolute;right:clamp(1.5rem,5vw,4.5rem);top:50%;transform:translateY(-50%) rotate(15deg);width:clamp(140px,20vw,260px);pointer-events:none}
.hero-shape svg{display:block;width:100%;height:auto}
@media (max-width:899px){.hero-shape{display:none}}
.hero-eyes{transform:translateY(-50%)!important}
.eye-pupil{transition:transform .08s linear}
.lhero-text .lsub{font:400 16px/24px var(--ff-d)!important}
.about-head .lsub{font:400 20px/32px var(--ff-d)!important}
.ab-big{font:700 36px/40px var(--ff-g)!important;max-width:28ch}
.about{padding-top:0!important;margin-top:40px}
.hero .intro{font:400 20px/32px var(--ff-d)!important}
/* section heroes (vieses / deceptive): left-aligned like the rest of the site */
.hero{text-align:left!important;justify-items:start!important}
.hero .intro{padding-inline:0!important;max-width:none!important}
.hero>div{width:100%}
.about-head .lsub{max-width:none!important}
/* landing cards: whole text block (number, title, text, Explorar) centered vertically */
.tile.t-tall>div,.tile.t-tall2>div{justify-content:center}
.t-tall>div>.t-big,.t-tall2>div>.t-big{margin-top:0!important}
.t-go{margin-top:auto!important;padding-top:16px!important;display:inline-flex!important;align-items:center;gap:8px;align-self:flex-start}
.t-go svg{display:block;flex:none}
.hero .search{margin-inline:0!important}
.hero{padding-top:0!important;margin-top:40px!important;gap:16px!important}
.about-head h1{font:800 48px/52px var(--ff-g)!important;letter-spacing:-.015em!important}
@media (max-width:599px){.about-head h1{font-size:36px!important;line-height:40px!important}}
@media (max-width:599px){.hero .intro{font-size:16px!important;line-height:24px!important}}
@media (max-width:599px){.ab-big{font:700 28px/36px var(--ff-d)!important}}
@media (max-width:599px){.about-head .lsub{font-size:16px!important;line-height:24px!important}}
/* text and shape in separate columns so they never overlap */
@media (min-width:900px){
  /* reserve the shape's column on the right so text can never run under it */
  .lhero-text{padding-right:calc(clamp(140px,18vw,240px) + clamp(3rem,7vw,7rem))!important}
  .lhero-text>div:not(.hero-shape){max-width:none!important}
  .hero-shape{width:clamp(140px,18vw,240px)!important;right:clamp(1.5rem,4vw,3.5rem)!important}
}
@media (max-width:599px){.lhero-text .lsub{font-size:16px!important;line-height:24px!important}}

/* ================= mobile hamburger menu ================= */
.burger,.mnav{display:none}
@media (max-width:760px){
  .mast .navlinks,.mast .mast-right{display:none!important}
  .burger{display:inline-grid;place-items:center;width:44px;height:44px;flex:none;border:0;border-radius:12px;background:var(--accent-t);color:var(--ink);cursor:pointer}
  .burger svg{width:22px;height:22px}
  .burger path{transition:transform .25s var(--ease),opacity .2s;transform-origin:12px 12px}
  .mast.menu-open .burger .b1{transform:translateY(5px) rotate(45deg)}
  .mast.menu-open .burger .b2{opacity:0}
  .mast.menu-open .burger .b3{transform:translateY(-5px) rotate(-45deg)}
  .mnav:not([hidden]){display:flex;flex-direction:column;gap:var(--s2);position:absolute;left:0;right:0;top:100%;
    background:var(--surface);border-bottom:1px solid var(--line);padding:var(--s2) max(20px,env(safe-area-inset-right,0px)) var(--s4) max(20px,env(safe-area-inset-left,0px));
    box-shadow:0 16px 32px -24px rgba(27,24,48,.45)}
  .mnav{text-align:left}
  .mnav-links{display:flex;flex-direction:column;gap:2px}
  .mnav-links a{display:block;padding:12px 14px;border-radius:12px;text-decoration:none;font:700 16px/24px var(--ff-d);color:var(--ink-2)}
  .mnav-links a:hover{background:var(--bg);color:var(--ink)}
  .mnav-links a[aria-current="page"]{background:var(--accent-t);color:var(--accent)}
  .mnav .mnav-theme{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border-top:1px solid var(--line);border-radius:0;margin-top:var(--s2);font:700 16px/24px var(--ff-d);color:var(--ink)}
  .mnav-theme-l{color:var(--ink)}
}

/* ================= Curió · style guide (manual de marca, nov. 2026) =================
   Anil #3C34C1 · Lavanda #EFEDFD · Tinta #1A1555 · Lima #D3F34F · Branco.
   Títulos Poppins 600, descrição Poppins 400, texto Open Sans (mín. 16px). */
:root{
  --ff-g:"Poppins",system-ui,sans-serif; --ff-d:"Open Sans",Arial,sans-serif;
  --f-display:var(--ff-g); --f-body:var(--ff-d); --f-hand:var(--ff-d);
  --bg:#EFEDFD; --surface:#FCFCFC; --ink:#1A1555; --ink-2:#4D4D4D; --ink-3:#666666;
  --line:#E2DFFB; --rule:#ABA5F3; --accent:#3C34C1; --accent-t:#EFEDFD; --accent-hover:#2B23A4;
  --c-info:#3C34C1; --c-info-t:#EFEDFD; --c-mean:#3C34C1; --c-mean-t:#EFEDFD;
  --c-fast:#3C34C1; --c-fast-t:#EFEDFD; --c-mem:#3C34C1; --c-mem-t:#EFEDFD;
}
:root[data-theme="dark"]{
  --bg:#1A1555; --surface:#211B7E; --ink:#FCFCFC; --ink-2:#E2DFFB; --ink-3:#ABA5F3;
  --line:#2B23A4; --rule:#3C34C1; --accent:#D3F34F; --accent-t:#2B23A4; --accent-hover:#DDF76F;
  --c-info:#E2DFFB; --c-info-t:#2B23A4; --c-mean:#E2DFFB; --c-mean-t:#2B23A4;
  --c-fast:#E2DFFB; --c-fast-t:#2B23A4; --c-mem:#E2DFFB; --c-mem-t:#2B23A4;
}
:root:not([data-theme="dark"]){--bg:#EFEDFD}
body{font:400 16px/24px var(--ff-d);color:var(--ink)}
/* titles: Poppins SemiBold */
h1,h2,h3,.t-h,.t-big,.qcard h2,.qtext h2,.bcard h3,.res b,.dnav b,.ab-big,.lsec,.lhero .lsec{font-family:var(--ff-g)!important;font-weight:600!important;letter-spacing:0!important}
.lhero h1{font:600 48px/56px var(--ff-g)!important;letter-spacing:-.01em!important}
.lhero h1 .h-light{font-weight:400!important}
.hero h1,.chead h1,.dhead h1,.page-head h1{font:600 40px/48px var(--ff-g)!important}
.lsec,.lhero .lsec,.ab-big{font:600 32px/40px var(--ff-g)!important}
.qcard h2,.qtext h2,.bcard h3,.empty-text h2{font:600 24px/32px var(--ff-g)!important}
.t-h,.res b,.dnav b{font:600 20px/28px var(--ff-g)!important}
.t-big{font:600 56px/64px var(--ff-g)!important}
/* description right under a title: Poppins Regular */
.hero .intro,.page-desc,.lsub,.lhero-text .lsub,.about-head .lsub{font:400 20px/30px var(--ff-g)!important}
.lhero-text .lsub{font-size:18px!important;line-height:28px!important}
.hero .intro,.page-desc{color:var(--ink-2)!important}
.lead{font:400 20px/30px var(--ff-g)!important}
.body,.chead .long{font:400 18px/30px var(--ff-d)!important}
/* interface text: Open Sans 16 */
.qcard p.desc,.qtext p.desc,.bcard p,.t-p,.note,.res span,.m-out,.xchip,.pill,.back,.qcard .go,.qcard .count,.bcard .more,.seg button{font-family:var(--ff-d)!important;font-size:16px!important;line-height:24px!important}
.mast .navlinks a,.mnav-links a,.back,.qcard .go-r,.bcard .more,.t-go,.seg button,.btn{font-family:var(--ff-d)!important;font-weight:600!important;font-size:16px!important;line-height:24px!important}
.ab-label,.sec h2,.chead .en,.dhead .en,.bcard .en,.step{font:600 14px/20px var(--ff-d)!important;letter-spacing:.08em!important;text-transform:uppercase!important;color:var(--accent)!important}
.ab-anil .ab-label{color:#D3F34F!important}
/* captions: 14px Open Sans, texto-suave */
.crumbs,.bcard .tag,.chip,.eyebrow,.m-fine,.mock-bar code{font-family:var(--ff-d)!important;font-weight:400!important;font-size:14px!important;line-height:24px!important;letter-spacing:0!important}
.bcard .tag,.chip{font-weight:600!important}
.crumbs{color:var(--ink-2);margin-bottom:0}
.crumbs a{color:var(--accent);border-bottom-color:transparent}
.crumbs a:hover{border-bottom-color:currentColor}
.m-h,.price,.big-claim{font-family:var(--ff-g)!important;font-weight:600!important}

/* menu superior: 72px, branco, linha inferior lavanda, logo anil 28px */
.mast{background:#FCFCFC!important;min-height:72px;align-items:center!important;box-shadow:inset 0 -1px 0 #EFEDFD;padding-block:12px!important}
:root[data-theme="dark"] .mast{background:#1A1555!important;box-shadow:inset 0 -1px 0 #2B23A4}
.mast .logo-chip{color:#3C34C1;padding:8px 8px 8px 0;font-size:0;line-height:0}
.logo-svg{display:block;height:26px;width:auto}
:root[data-theme="dark"] .mast .logo-chip{color:#EFEDFD}
.mast-left{gap:24px!important}
.mast{padding-inline:max(40px,env(safe-area-inset-left,0px)) max(40px,env(safe-area-inset-right,0px))!important}
@media (max-width:759px){.mast{padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px))!important}}
.mast .logo-chip{padding-right:0!important}
.mast .navlinks{gap:4px}
.mast .navlinks a{color:var(--ink)!important;padding:8px 16px!important;border-radius:999px}
.mast .navlinks a:hover{background:#EFEDFD;color:var(--ink)!important}
.mast .navlinks a[aria-current="page"]{background:#EFEDFD;color:#3C34C1!important}
:root[data-theme="dark"] .mast .navlinks a:hover{background:#2B23A4}
:root[data-theme="dark"] .mast .navlinks a[aria-current="page"]{background:#2B23A4;color:#FCFCFC!important}
.mnav-links a{color:var(--ink)!important}
.mnav-links a[aria-current="page"]{background:#EFEDFD;color:#3C34C1!important}
:root[data-theme="dark"] .mnav-links a[aria-current="page"]{background:#2B23A4;color:#FCFCFC!important}
.burger{background:#EFEDFD!important;color:#3C34C1!important}
:root[data-theme="dark"] .burger{background:#2B23A4!important;color:#FCFCFC!important}
.mnav{background:var(--surface)!important}
.theme-sw .track{background:#ABA5F3!important}
.theme-sw[aria-checked="true"] .track{background:#D3F34F!important}
.theme-sw[aria-checked="true"] .knob{background:#1A1555!important}
.pbar{top:calc(env(safe-area-inset-top,0px) + 72px)!important}

/* blocks and cards: radius 24 for big blocks, 16 for cards; no shadows */
.lhero-text,.ab-card,.tile.t-tall,.tile.t-tall2,.hub .qcard.qsplit,.qcard,.empty-card{border-radius:24px!important}
.bcard,.dnav a,.results,.stage{border-radius:16px!important}
.qcard,.bcard,.dnav a,.tile.t-tall,.tile.t-tall2,.results,.stage,.empty-card{background:var(--surface)!important;box-shadow:none!important}
.ab-anil{background:#3C34C1!important}
.lhero-text{background:#FBFAFE!important;color:#2B23A4!important}
.lhero-text h1,.lhero-text .lsub{color:#2B23A4!important}
:root[data-theme="dark"] .lhero-text{background:#211B7E!important}
:root[data-theme="dark"] .lhero-text h1,:root[data-theme="dark"] .lhero-text .lsub{color:#EFEDFD!important}
.qcard:hover,.bcard:hover,.tile:hover{box-shadow:0 2px 8px rgba(26,21,85,.08)!important}
.seg button[aria-pressed="true"]{background:#3C34C1;color:#FCFCFC}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#D3F34F;color:#1A1555}
/* illustration panels: lime for the anil-faced shapes, light anil for the door */
.tile.t-tall .t-illo{background:#D3F34F!important}
.tile.t-tall2 .t-illo{background:#ABA5F3!important}
[data-cat="significado"],[data-cat="memoria"],[data-cat="obstrucao"],[data-cat="forcada"]{--band:#D3F34F}
[data-cat="informacao"],[data-cat="interferencia"]{--band:#3C34C1}
[data-cat="rapido"],[data-cat="furtividade"]{--band:#1A1555}

/* pages: Sobre, Artigos, Trilhas, Contato */
.page{display:grid;gap:24px;margin-top:40px}
.page-head{display:grid;gap:16px;margin-bottom:16px}
.page-head .crumbs{margin-bottom:-4px}
.page-desc{margin:0;max-width:none}
.page-head b{font-weight:600}
.hero .crumbs{margin-bottom:-4px}
.step{margin:0 0 8px}
.qtext .count{color:var(--ink-2)}
.empty-card{display:flex;align-items:center;gap:32px;padding:32px}
.empty-illo{flex:none;width:clamp(120px,16vw,180px);aspect-ratio:1;border-radius:16px;background:#D3F34F;display:grid;place-items:center}
.empty-illo svg{width:72%;height:auto}
.empty-text{display:grid;gap:16px;justify-items:start;min-width:0}
.empty-text p{margin:0;color:var(--ink-2);max-width:60ch}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:12px 24px;border-radius:999px;background:#3C34C1;color:#FCFCFC!important;text-decoration:none}
.btn:hover{background:#2B23A4}
.btn svg{width:20px;height:20px;flex:none}
:root[data-theme="dark"] .btn{background:#D3F34F;color:#1A1555!important}
:root[data-theme="dark"] .btn:hover{background:#DDF76F}
@media (max-width:599px){.empty-card{flex-direction:column;align-items:flex-start;padding:24px}}
svg path{stroke-linecap:round;stroke-linejoin:round}
@media (max-width:599px){
  .lhero h1{font-size:36px!important;line-height:44px!important}
  .hero h1,.chead h1,.dhead h1,.page-head h1{font-size:32px!important;line-height:40px!important}
  .lsec,.lhero .lsec,.ab-big{font-size:24px!important;line-height:32px!important}
  .hero .intro,.page-desc,.lead{font-size:18px!important;line-height:28px!important}
  .lhero-text .lsub{font-size:16px!important;line-height:24px!important}
}
:focus-visible{outline:2px solid #4C44DE;outline-offset:2px}
:root[data-theme="dark"] :focus-visible,.lhero-text :focus-visible,.ab-anil :focus-visible{outline-color:#D3F34F}
.hub.hub-one{grid-template-columns:minmax(0,1fr)!important}
.lhero-text .lbottom{display:grid;justify-items:start}
.hero-btn{margin-top:8px}
/* home: anil-500 background below the anil-50 band */
:root:not([data-theme="dark"]) body:has(.landing){background:#4C44DE}
:root:not([data-theme="dark"]) .landing .lsec{color:#FCFCFC}
/* home hero: full-bleed band touching the top menu; text aligned to the page column */
:root{--gut:20px}
@media (min-width:760px){:root{--gut:80px}}
@media (min-width:1200px){:root{--gut:max(160px,calc((100vw - 1320px) / 2))}}
.landing .lhero{margin-top:-32px!important}
.lhero-text{width:100vw!important;max-width:none!important;margin-inline:calc(50% - 50vw)!important;border-radius:0!important;padding:clamp(3rem,6vw,5rem) var(--gut)!important;box-sizing:border-box}
@media (min-width:900px){.lhero-text{padding-right:var(--gut)!important}}
/* home trail cards: shorter, smaller illustrations */
.tile.t-tall,.tile.t-tall2{min-height:0!important}
.tile.t-tall>div,.tile.t-tall2>div{padding:24px 32px!important;justify-content:flex-start!important;gap:8px}
.tile.t-tall .t-illo,.tile.t-tall2 .t-illo{padding:16px!important}
.t-illo svg{max-width:112px!important}
.tile.t-tall .t-illo,.tile.t-tall2 .t-illo{flex:0 0 36%!important}
.t-h{margin:0}
.t-go{padding-top:8px!important}
@media (max-width:599px){.tile.t-tall>div,.tile.t-tall2>div{padding:20px!important}.t-illo svg{max-width:88px!important}}
/* feedback band (home), anil-200, full-bleed down to the page end */
.fb-band{width:100vw;margin:64px calc(50% - 50vw) calc(-1 * var(--s8));padding:64px var(--gut);box-sizing:border-box;background:#2B23A4;color:#FCFCFC}
.fb-band .fb-head h2,.fb-band .fb-head p,.fb-band .fb-form label,.fb-band .fb-status,.fb-band .fb-status[data-kind="err"]{color:#FCFCFC!important}
.fb-band .fb-send{background:#D3F34F!important;color:#1A1555!important}
.fb-band .fb-send:hover{background:#B7E214!important}
.fb-band .fb-send:disabled{background:#E6E6E6!important;color:#666666!important}
.fb-band :focus-visible,.fb-band .fb-form textarea:focus{outline:none;box-shadow:0 0 0 3px #D3F34F!important}
.fb-inner{display:grid;gap:32px;align-items:start}
@media (min-width:900px){.fb-inner{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:64px}}
.fb-head{display:grid;gap:16px}
.fb-head h2{font:600 32px/40px var(--ff-g)!important;color:#1A1555;margin:0}
.fb-head p{margin:0;font:400 16px/24px var(--ff-g)!important;color:#1A1555}
:root[data-theme="dark"] .fb-head p{color:#FCFCFC!important}
.lhero-text .lsub{font-size:16px!important;line-height:24px!important}
.fb-form{display:grid;gap:8px}
.fb-form label{font:600 16px/24px var(--ff-d);color:#1A1555}
.fb-form textarea{width:100%;box-sizing:border-box;min-height:112px;resize:vertical;padding:12px 16px;border:1.5px solid #E2DFFB;border-radius:12px;background:#FCFCFC;color:#1A1555;font:400 16px/24px var(--ff-d)}
.fb-form textarea::placeholder{color:#666666}
.fb-form textarea:hover{border-color:#4C44DE}
.fb-form textarea:focus,.fb-form textarea:focus-visible{outline:none;border-color:#3C34C1;box-shadow:0 0 0 3px #ABA5F3}
.fb-row{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:8px}
.fb-send{border:0;cursor:pointer}
.fb-send:disabled{background:#E6E6E6!important;color:#666666!important;cursor:default}
.fb-status{margin:0;font:400 16px/24px var(--ff-d);color:#1A1555}
.fb-status[data-kind="err"]{color:#211B7E;font-weight:600}
:root[data-theme="dark"] .fb-band{background:#211B7E;color:#FCFCFC}
:root[data-theme="dark"] .fb-head h2,:root[data-theme="dark"] .fb-form label,:root[data-theme="dark"] .fb-status{color:#FCFCFC}
:root[data-theme="dark"] .fb-head p{color:#E2DFFB}
@media (max-width:599px){.fb-band{padding:48px var(--gut)}.fb-head h2{font-size:24px!important;line-height:32px!important}.fb-head p{font-size:18px;line-height:28px}}
.landing .lsec,.lhero .lsec,.fb-head h2{font-size:28px!important;line-height:36px!important}
@media (max-width:599px){.landing .lsec,.lhero .lsec,.fb-head h2{font-size:24px!important;line-height:32px!important}}
.landing .lhero .lsec{margin-top:calc(72px - var(--s6))!important}
/* theme switch in light anil (anil-200) */
.theme-sw .track{background:#E2DFFB!important}
.theme-sw .knob{background:#3C34C1!important}
.theme-sw[aria-checked="true"] .track{background:#E2DFFB!important}
.theme-sw[aria-checked="true"] .knob{background:#1A1555!important}
/* articles */
.agrid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.agrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.agrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.acard{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px #E2DFFB;transition:box-shadow .2s}
.acard:hover{box-shadow:inset 0 0 0 1.5px #E2DFFB,0 2px 8px rgba(26,21,85,.08)}
.acard-illo{display:grid;place-items:center;height:140px}
.acard-illo svg{height:88px;width:auto}
.acard-body{display:flex;flex-direction:column;gap:8px;padding:24px;flex:1}
.acard-meta{font:600 11px/16px var(--ff-d);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.acard-title{font:600 20px/28px var(--ff-g);color:var(--ink)}
.acard-desc{font:400 16px/24px var(--ff-d);color:var(--ink-2)}
.acard-go{margin-top:auto;padding-top:8px;display:inline-flex;align-items:center;gap:8px;font:600 16px/24px var(--ff-d);color:var(--accent)}
.acard-go svg,.art-all svg{width:20px;height:20px;flex:none}
.art-band{width:100vw;margin:0 calc(50% - 50vw);padding:72px var(--gut);box-sizing:border-box;background:#EFEDFD}

@media (max-width:599px){.art-band{padding:48px var(--gut)}.art-band-head h2{font-size:24px!important;line-height:32px!important}}
.art-meta{margin:-24px 0 0;font:600 12px/16px var(--ff-d);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.art-read{background:var(--surface);border-radius:16px;padding:clamp(24px,5vw,56px);display:grid;gap:16px;max-width:820px}
.art-read p,.art-read li{font:400 18px/30px var(--ff-d);color:var(--ink);margin:0}
.art-read h2{font:600 24px/32px var(--ff-g)!important;margin:16px 0 0}
.art-read ul{margin:0;padding-left:1.25rem;display:grid;gap:8px}
.art-read a{color:var(--accent);text-underline-offset:3px}
.art-read b{font-weight:700}
.art-take{margin-top:16px;padding:24px;border-radius:16px;background:#3C34C1;color:#FCFCFC;display:grid;gap:8px}
.art-take p:last-child{font:600 20px/30px var(--ff-g);color:#FCFCFC}
.art-rel{display:grid;gap:12px;margin-top:8px}
.art-rel h2{font-size:20px!important;line-height:28px!important;margin:0}
.art-more{display:grid;gap:24px;margin-top:40px}
.art-more h2{font:600 28px/36px var(--ff-g)!important;margin:0}
.art-more .agrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.art-take .ab-label{color:#D3F34F!important}
.landing .lhero{gap:0!important;margin-bottom:0!important}
:root:not([data-theme="dark"]) body:has(.bg-50){background:#FBFAFE}
.bg-50 .art-read{box-shadow:inset 0 0 0 1.5px #E2DFFB}
.page-desc,.hero .intro,.art-read p,.art-read li{font-size:16px!important;line-height:24px!important}
/* home hero: speech balloons beside title and subtitle */
.hero-baloes{display:none}
@media (min-width:900px){
  .lhero-text{padding-right:calc(var(--gut) + clamp(260px,30vw,440px) + 48px)!important}
  .lhero-text>.hero-baloes{display:block;position:absolute!important;right:var(--gut);top:50%;transform:translateY(-50%);width:clamp(260px,30vw,440px);max-width:none!important;z-index:0;pointer-events:none}
  .hero-baloes svg{display:block;width:100%;height:auto}
}
@media (min-width:900px){.lhero-text>.hero-baloes{width:clamp(220px,24vw,340px)!important}.lhero-text{padding-right:calc(var(--gut) + clamp(220px,24vw,340px) + 48px)!important}}
@media (min-width:900px){.lhero-text>.hero-baloes{width:clamp(300px,34vw,480px)!important}.lhero-text{padding-right:calc(var(--gut) + clamp(300px,34vw,480px) + 48px)!important}}
.acard-illo{height:160px!important;display:block!important}
.acard-illo svg{display:block;width:100%!important;height:100%!important}
.fb-head{gap:8px!important}
.fb-form{gap:4px!important}
.fb-form .fb-row{margin-top:12px}
.fb-form textarea{resize:none!important}
.acard-illo img{display:block;width:100%;height:100%;object-fit:cover}
/* feedback left, social right */
.fb-left{display:grid;gap:24px;min-width:0}
@media (min-width:900px){.fb-inner{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)!important;gap:96px!important}}
.fb-social{display:grid;gap:8px;align-content:start}
.fb-social h3{font:600 24px/32px var(--ff-g)!important;color:#FCFCFC;margin:0}
.fb-social p{margin:0;font:400 16px/24px var(--ff-d);color:#FCFCFC}
.social-list{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:12px}
.social-list a{display:inline-flex;align-items:center;gap:12px;color:#FCFCFC;text-decoration:none;font:600 16px/24px var(--ff-d)}
.social-list svg{box-sizing:border-box;width:48px;height:48px;padding:12px;border-radius:999px;background:#EFEDFD;color:#3C34C1;flex:none;transition:background .2s}
.social-list a:hover svg{background:#D3F34F}
.social-list a:hover span{text-decoration:underline}
.social-list .ic{--icbg:#EFEDFD;width:48px;height:48px;flex:none;border-radius:999px;background:var(--icbg);display:grid;place-items:center;transition:background .2s}
.social-list a:hover .ic{--icbg:#D3F34F}
.social-list .ic svg{width:24px!important;height:24px!important;padding:0!important;background:none!important;border-radius:0!important;fill:#3C34C1;overflow:visible}
/* article page: everything as wide as the reading column */
.page.article{max-width:720px;margin-inline:auto}
.page.article .art-read{max-width:none}
.page.article .art-more .agrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.page.article .page-head h1{font-size:32px!important;line-height:40px!important;text-wrap:wrap!important;max-width:none!important;width:100%}
@media (max-width:599px){.page.article .page-head h1{font-size:28px!important;line-height:36px!important}}
/* article card: border around the whole card, image included */
.acard{border:1.5px solid #E2DFFB!important;box-shadow:none!important}
.acard:hover{box-shadow:0 2px 8px rgba(26,21,85,.08)!important}
:root[data-theme="dark"] .acard{border-color:#2B23A4!important}
/* article text sits directly on the page, no white container */
.art-read,.bg-50 .art-read{background:none!important;box-shadow:none!important;border:0!important;padding:0!important;border-radius:0!important}
.art-read .rich .fig--full{margin-left:calc(50% - 50vw)!important;margin-right:calc(50% - 50vw)!important;width:100vw!important}
.art-read .rich .fig--outset{margin-left:-80px!important;margin-right:-80px!important}
@media (max-width:999px){.art-read .rich .fig--outset{margin-left:0!important;margin-right:0!important}}
/* publication date: quieter than the tag line */

/* article body: corpo-grande (18/30), same as the editor */
.art-read p,.art-read li,.art-read .rich p,.art-read .rich li{font-size:18px!important;line-height:30px!important}

.art-read>p,.art-read>ul>li,.art-read>ol>li,.art-read .rich p,.art-read .rich li{font-family:"Literata",Georgia,serif!important;font-size:19px!important;line-height:32px!important;font-weight:400!important;color:#1A1555}
.art-read>p,.art-read .rich>p{margin:0 0 24px!important}

.art-read .art-take{margin-top:32px!important}

:root[data-theme="dark"] .art-read>p a,:root[data-theme="dark"] .art-read li a,:root[data-theme="dark"] .art-read .rich a,:root[data-theme="dark"] .art-read .rich .pull-quote p{color:#D3F34F!important}

  {id:'significado', name:'Falta de Significado', short:'Significado', en:'Not Enough Meaning',
